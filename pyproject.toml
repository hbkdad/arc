[project]
name = "acr"
version = "0.1.0"
description = "ACR — Adaptive Cognitive Runtime: a local-first, model-independent AI orchestration and cognitive runtime."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[aiosqlite]>=2.0.51",
    "structlog>=26.1.0",
    "typer>=0.27.0",
]

[project.scripts]
acr = "acr.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["acr"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated revision scripts: autogenerated boilerplate, not hand-written.
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
