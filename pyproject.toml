[project]
# PyPI distribution name -- "acr" itself is taken (an unrelated, abandoned
# 2011 CMS package). The installed CLI command stays `acr` regardless
# ([project.scripts] below); only `pip install <name>` changes.
name = "acr-runtime"
version = "0.1.0"
description = "ACR — Adaptive Cognitive Runtime: a local-first, model-independent AI orchestration and cognitive runtime."
readme = "README.md"
license = "MIT"
authors = [{ name = "hbkdad" }]
requires-python = ">=3.12"
keywords = [
    "ai",
    "agent",
    "orchestration",
    "llm",
    "local-first",
    "mcp",
    "ollama",
]
classifiers = [
    # No "License :: OSI Approved :: MIT License" classifier: redundant
    # (and deprecated per PEP 639) alongside the `license = "MIT"` SPDX
    # expression above -- uv build itself warns about the combination.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=1.0.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy[aiosqlite]>=2.0.51",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "uvicorn>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/hbkdad/arc"
Repository = "https://github.com/hbkdad/arc"
Issues = "https://github.com/hbkdad/arc/issues"
Documentation = "https://github.com/hbkdad/arc/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
acr = "acr.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution name ("acr-runtime") differs from the importable module
# ("acr", at src/acr/) -- uv_build otherwise assumes they match.
module-name = "acr"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["acr"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented API requires `= typer.Argument(...)` / `= typer.Option(...)`
# as literal parameter defaults — that's how it introspects CLI signatures, not
# a mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated revision scripts: autogenerated boilerplate, not hand-written.
"src/acr/migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
