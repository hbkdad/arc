id: ui-design-critique
name: UI Design Critique
version: "1.0.0"
description: Give structured, specific design feedback across first impression, usability, visual hierarchy, consistency, and accessibility -- not a vague reaction.
task_classes:
  - ui-review
  - design-critique
inputs:
  target: string
outputs:
  critique: string
dependencies: []
permissions:
  - network.read
tools:
  - browser_fetch
models: []
token_estimate: 416
applicability: Use when asked to review, critique, or give feedback on a UI, screen, or design -- whether a live page, a mockup description, or a set of templates.
contraindications: Do not use for pure backend/API design review with no visual surface, or when the request is just "build this" with no evaluative feedback wanted.
verification: Each finding must name a specific element and a specific principle it violates or satisfies, with a concrete recommendation -- never an unexplained "this feels off."
origin: manual
author: acr-team
