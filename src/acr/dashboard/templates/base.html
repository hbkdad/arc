<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACR Dashboard{% if active %} — {{ active | capitalize }}{% endif %}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2EEE3;
    --surface: #FBF8F0;
    --surface-2: #E8E1D0;
    --line: #D6CCB3;
    --ink: #1E1B15;
    --ink-dim: #6B6252;
    --accent: #A8571F;
    --accent-ink: #FBF3E8;
    --wire: #3E5443;
    --ok: #2E7D4F;
    --warn: #96660A;
    --danger: #A8362A;
    --info: #3F5E82;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120E;
      --surface: #1B1812;
      --surface-2: #211D16;
      --line: #332E24;
      --ink: #EDE7D9;
      --ink-dim: #A39985;
      --accent: #D98A4B;
      --accent-ink: #241202;
      --wire: #6B8A72;
      --ok: #5FAE7C;
      --warn: #D9A24A;
      --danger: #D9695A;
      --info: #7FA0C7;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--sans);
    margin: 0;
    display: flex;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- nav --- */
  nav {
    width: 190px;
    flex-shrink: 0;
    padding: 1.25rem 0;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }
  .brand {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink);
    padding: 0 1.25rem 1rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  .brand span { display: block; font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.02em; margin-top: 2px; }
  nav a {
    display: block;
    padding: 0.45rem 1.25rem;
    text-decoration: none;
    color: var(--ink-dim);
    font-size: 13px;
    border-left: 2px solid transparent;
  }
  nav a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 4%, transparent); }
  nav a.active {
    color: var(--ink);
    font-weight: 700;
    border-left-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }

  /* --- main --- */
  main { flex: 1; padding: 1.75rem 2.25rem 3rem; max-width: 1180px; }
  h1 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.01em;
    margin: 0 0 1.1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--line);
  }
  main > h1:not(:first-child) { margin-top: 2.25rem; }
  h2.section-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    font-weight: 700;
    margin: 0 0 0.75rem;
  }
  p.lede { color: var(--ink-dim); max-width: 68ch; margin: -0.5rem 0 1.25rem; }
  code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--surface-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  /* --- metric cards --- */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
  .metric-card {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 0.7rem 0.9rem;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  a.metric-card:hover { border-color: var(--accent); }
  .metric-card .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    font-weight: 700;
    display: block;
    line-height: 1.1;
  }
  .metric-card .label {
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 0.2rem;
    display: block;
  }

  /* --- status pills --- */
  .pill {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .pill-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .pill-warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .pill-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .pill-info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
  .pill-neutral { background: var(--surface-2); color: var(--ink-dim); }

  /* --- tables --- */
  .table-wrap { overflow-x: auto; margin-bottom: 1.75rem; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--surface); }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
    font-weight: 700;
    background: var(--surface-2);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .empty { color: var(--ink-dim); font-style: italic; padding: 1rem 0.75rem; }

  /* --- legend / swatches --- */
  .legend { display: flex; flex-wrap: wrap; gap: 1.1rem; margin: 0 0 1rem; font-size: 12px; color: var(--ink-dim); }
  .legend .item { display: flex; align-items: center; gap: 0.4rem; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; flex-shrink: 0; }
  .legend .swatch.circle { border-radius: 50%; }
  .legend .swatch.diamond { transform: rotate(45deg); }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    nav { width: 100%; flex-direction: row; overflow-x: auto; padding: 0.5rem; align-items: center; }
    .brand { display: none; }
    nav a { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
    nav a.active { border-bottom-color: var(--accent); }
    main { padding: 1.25rem 1rem 2rem; }
  }
</style>
</head>
<body>
<nav>
  <div class="brand">ACR<span>Adaptive Cognitive Runtime</span></div>
  <a href="/" class="{{ 'active' if active == 'overview' }}">Overview</a>
  <a href="/tasks" class="{{ 'active' if active == 'tasks' }}">Tasks</a>
  <a href="/agents" class="{{ 'active' if active == 'agents' }}">Agents</a>
  <a href="/memory" class="{{ 'active' if active == 'memory' }}">Memory</a>
  <a href="/skills" class="{{ 'active' if active == 'skills' }}">Skills</a>
  <a href="/tools" class="{{ 'active' if active == 'tools' }}">Tools</a>
  <a href="/routing" class="{{ 'active' if active == 'routing' }}">Routing</a>
  <a href="/security" class="{{ 'active' if active == 'security' }}">Security</a>
  <a href="/benchmarks" class="{{ 'active' if active == 'benchmarks' }}">Benchmarks</a>
  <a href="/proposals" class="{{ 'active' if active == 'proposals' }}">Proposals</a>
  <a href="/events" class="{{ 'active' if active == 'events' }}">Events</a>
  <a href="/visualization" class="{{ 'active' if active == 'visualization' }}">Visualization</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
