id: code-review-checklist
name: Code Review Checklist
version: "1.0.0"
description: Review a diff for correctness, security, simplification, and test coverage -- verified findings only, ranked by severity.
task_classes:
  - code-review
inputs:
  diff: string
outputs:
  findings: string
dependencies: []
permissions: []
tools: []
models: []
token_estimate: 300
applicability: Use when asked to review a code change, diff, or pull request before it's merged or shipped.
contraindications: Do not use for reviewing generated documentation/prose with no executable behavior, or for a change too large to review as a whole (split it first).
verification: Every finding must include a concrete failure scenario (specific input/state that produces a wrong output or crash) -- a stylistic preference with no failure scenario is not a finding, it's an opinion.
origin: manual
author: acr-team
